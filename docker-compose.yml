version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env       # contains MISTRAL_API_KEY etc.
    expose:
      - "8000"

  frontend:
    build:
      context: .
    # dockerfile defaults to ./Dockerfile, but our frontend Dockerfile is in frontend/
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"            # public HTTP port
    depends_on:
      - backend

